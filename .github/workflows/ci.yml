name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_test
      TEST_DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_test
      BETTER_AUTH_SECRET: ci-secret-only-for-tests-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      DEMO_PASSWORD: Demo-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: E2E
        run: |
          pnpm db:migrate && pnpm db:seed
          pnpm --filter @crm/web exec playwright install --with-deps chromium
          pnpm test:e2e
        working-directory: .
